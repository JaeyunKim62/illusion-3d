<!DOCTYPE html>
<!--
  record.html — auto-playing 10s capture of the light_source.html renderer.

  Built on the light_source.html rendering core (dark background, blue sphere-impostor
  point cloud, manual orbit camera, view-space point lighting + a glowing light marker).
  No sidebar: the canvas is captured with MediaRecorder and downloaded as a .webm.

  The light orbits in world space: fixed radius + elevation, slowly rotating azimuth, so
  it circles the object independently of the camera and sweeps the shading across it.

  Timeline (10s):
    0–8s   slowly rotate through the silhouette views: front -> side(+X) -> top(+Y) -> 3/4
    8–10s  hold 3/4 view, dolly camera distance 3 -> 0.128 to reveal it is just points

  Library: three.js r160 (MIT, https://threejs.org) via jsDelivr CDN. Cite in write-up.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Record · Point Cloud Light</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0c0c10; display: flex; flex-direction: column;
    justify-content: center; align-items: center; height: 100vh;
  }
  canvas { max-width: 90vw; max-height: 82vh; background: #141420; }
  #status {
    margin-top: 16px; color: #94a3b8;
    font: 600 13px/1 'Helvetica Neue', monospace; letter-spacing: 1px;
  }
  #bar-wrap { margin-top: 8px; width: 320px; height: 4px; background: #27273a; border-radius: 2px; overflow: hidden; }
  #bar { height: 100%; width: 0%; background: linear-gradient(90deg, #8f9bff, #4f46e5); transition: width 0.1s; }
</style>
</head>
<body>
<div id="status">Loading point cloud …</div>
<div id="bar-wrap"><div id="bar"></div></div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

// ── Config ───────────────────────────────────────────────────────────────────
const WIDTH = 1920, HEIGHT = 1080, FPS = 60, TOTAL = 10;
const params = new URLSearchParams(location.search);
const dataPath = params.get('points') || 'data/points.json';

// ── Renderer / scene / camera ────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(WIDTH, HEIGHT);                 // pixelRatio 1 -> backing store is exactly 1920x1080
renderer.setClearColor(0x141420, 1.0);
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(45, WIDTH / HEIGHT, 0.1, 100);
camera.matrixAutoUpdate = false;
camera.matrixWorldAutoUpdate = false;

// ── State (driven by the timeline) ───────────────────────────────────────────
const state = {
  pointSize: 0.003,
  pointColor: new THREE.Color(0.4, 0.8, 0.7),
  yaw: 0, pitch: 0, distance: 10,
  lightAz: -180,                                   // animated: slow horizontal orbit
};
const lightWorld = new THREE.Vector3();
const LIGHT_MARKER_SIZE = 0.06;                    // visible glowing light, world units

// World-space light: fixed orbit radius + elevation, only the azimuth animates, so the
// light slowly circles the object on its own — independent of the camera. This sweeps
// the shading / specular highlight across the object and gives the light a clear role.
const LIGHT_DIST     = 2.2;    // orbit radius (world units) — bump up if the marker looks buried
const LIGHT_EL       = 40;     // fixed elevation (deg)
const LIGHT_AZ_START = 0;   // starting azimuth (deg) — the initial light position
const LIGHT_AZ_RATE  = 120;     // deg/sec — slow horizontal orbit (300° over the 10s clip)

// ── Shaders (ported from light_source.html) ──────────────────────────────────
// renderMode 0: lit point-cloud sphere · 1: glowing light marker
const VERT = `
  uniform float uPointSize;
  uniform float uViewportHeight;
  varying vec3 vViewPos;
  void main() {
    vec4 viewPos = modelViewMatrix * vec4(position, 1.0);
    vViewPos = viewPos.xyz;
    gl_Position = projectionMatrix * viewPos;
    float dist = max(-viewPos.z, 0.001);
    gl_PointSize = (uPointSize * projectionMatrix[1][1] * uViewportHeight) / dist;
    if (gl_PointSize < 1.0) gl_PointSize = 1.0;
  }
`;
const FRAG = `
  uniform vec3 uLightPos;       // VIEW space
  uniform vec3 uPointColor;
  uniform int  uRenderMode;
  varying vec3 vViewPos;
  void main() {
    vec2 nc = gl_PointCoord * 2.0 - 1.0;
    float r2 = dot(nc, nc);
    if (r2 > 1.0) discard;
    float z = sqrt(1.0 - r2);
    vec3 normal = normalize(vec3(nc.x, -nc.y, z));

    if (uRenderMode == 1) {                        // glowing light marker
      float centerGlow = pow(1.0 - r2, 2.0);
      vec3 glow = mix(vec3(1.0, 0.95, 0.5), vec3(1.0), centerGlow);
      gl_FragColor = vec4(glow, 1.0);
      return;
    }

    vec3 L = normalize(uLightPos - vViewPos);      // lit point cloud
    float ambient = 0.25;
    float diffuse = max(dot(normal, L), 0.0);
    vec3 V = normalize(-vViewPos);
    vec3 R = reflect(-L, normal);
    float spec = pow(max(dot(R, V), 0.0), 32.0) * 0.4;
    vec3 col = uPointColor * (ambient + diffuse) + vec3(spec);
    gl_FragColor = vec4(col, 1.0);
  }
`;

const uniforms = {
  uPointSize:      { value: state.pointSize },
  uViewportHeight: { value: HEIGHT },
  uLightPos:       { value: new THREE.Vector3() },
  uPointColor:     { value: state.pointColor },
  uRenderMode:     { value: 0 },
};
const cloudMat = new THREE.ShaderMaterial({ uniforms, vertexShader: VERT, fragmentShader: FRAG });

// glowing light marker: single point, own size + renderMode, shared viewport uniform
const lightGeo = new THREE.BufferGeometry();
lightGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(3), 3));
const lightMat = new THREE.ShaderMaterial({
  vertexShader: VERT, fragmentShader: FRAG,
  uniforms: {
    uPointSize:      { value: LIGHT_MARKER_SIZE },
    uViewportHeight: uniforms.uViewportHeight,
    uLightPos:       uniforms.uLightPos,
    uPointColor:     uniforms.uPointColor,
    uRenderMode:     { value: 1 },
  },
});
const lightMarker = new THREE.Points(lightGeo, lightMat);
lightMarker.frustumCulled = false;
scene.add(lightMarker);

// ── View matrix (orbit camera; identical math to light_source.py) ─────────────
const _V = new THREE.Matrix4(), _T = new THREE.Matrix4(), _Rx = new THREE.Matrix4(), _Ry = new THREE.Matrix4();
function updateCameraMatrices() {
  _T.makeTranslation(0, 0, -state.distance);
  _Rx.makeRotationX(THREE.MathUtils.degToRad(state.pitch));
  _Ry.makeRotationY(THREE.MathUtils.degToRad(state.yaw));
  _V.copy(_T).multiply(_Rx).multiply(_Ry);
  camera.matrixWorldInverse.copy(_V);
  camera.matrixWorld.copy(_V).invert();
  camera.matrix.copy(camera.matrixWorld);
}

function updateLight() {
  // World-space spherical position: fixed radius + elevation, animated azimuth.
  const az = THREE.MathUtils.degToRad(state.lightAz);
  const el = THREE.MathUtils.degToRad(LIGHT_EL);
  lightWorld.set(
    LIGHT_DIST * Math.cos(el) * Math.sin(az),
    LIGHT_DIST * Math.sin(el),
    LIGHT_DIST * Math.cos(el) * Math.cos(az),
  );
  lightGeo.attributes.position.setXYZ(0, lightWorld.x, lightWorld.y, lightWorld.z);
  lightGeo.attributes.position.needsUpdate = true;
}

// ── Timeline tracks ([time, value] keyframes, smoothstep eased) ───────────────
const smooth = p => p * p * (3 - 2 * p);
function track(keys, t) {
  if (t <= keys[0][0]) return keys[0][1];
  if (t >= keys[keys.length-1][0]) return keys[keys.length-1][1];
  let i = 0; while (i < keys.length-1 && keys[i+1][0] < t) i++;
  const [t0, v0] = keys[i], [t1, v1] = keys[i+1];
  return v0 + (v1 - v0) * smooth((t - t0) / (t1 - t0));
}

const YAW_KEYS   = [[0,0],[1.0,0],[3.0,-90],[3.8,-90],[5.5,-180],[6.3,-180],[7.8,-45],[10,-131.6]];  // front → side(+X) → tower top → 3/4
const PITCH_KEYS = [[0,0],[1.0,0],[3.0,0],[3.8,0],[5.5,90],[6.3,90],[7.8,30],[10,63]];            // tower top: pitch 89
const DIST_KEYS  = [[0,10],[8,10],[10,0.128]];                                                      // hold, then dolly-in reveal

function applyState(t) {
  state.lightAz  = LIGHT_AZ_START + LIGHT_AZ_RATE * t;   // slow horizontal orbit, independent of view
  state.yaw      = track(YAW_KEYS, t);
  state.pitch    = track(PITCH_KEYS, t);
  state.distance = track(DIST_KEYS, t);

  updateLight();             // world-space light + glow marker
  updateCameraMatrices();
  uniforms.uLightPos.value.copy(lightWorld).applyMatrix4(camera.matrixWorldInverse);  // -> view space for shader
}

// ── Load point cloud (centroid-centered; positions only) ──────────────────────
const status = document.getElementById('status'), bar = document.getElementById('bar');

fetch(dataPath)
  .then(r => r.json())
  .then(data => {
    const pts = data.points, n = pts.length;
    const c = new THREE.Vector3();
    for (let i = 0; i < n; i++) { c.x += pts[i][0]; c.y += pts[i][1]; c.z += pts[i][2]; }
    c.multiplyScalar(1 / n);

    const pos = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) {
      pos[i*3]   = pts[i][0] - c.x;
      pos[i*3+1] = pts[i][1] - c.y;
      pos[i*3+2] = pts[i][2] - c.z;
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    const cloud = new THREE.Points(geo, cloudMat);
    cloud.frustumCulled = false;
    scene.add(cloud);

    status.textContent = 'Recording …';
    startRecording();
  })
  .catch(() => { status.textContent = `Error: ${dataPath} not found`; });

// ── Record canvas to webm ─────────────────────────────────────────────────────
function startRecording() {
  const stream = renderer.domElement.captureStream(FPS);
  let mimeType = 'video/webm;codecs=vp9';
  if (!MediaRecorder.isTypeSupported(mimeType)) {
    mimeType = 'video/webm;codecs=vp8';
    if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = 'video/webm';
  }
  const recorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 12_000_000 });
  const chunks = [];
  recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  recorder.onstop = () => {
    const blob = new Blob(chunks, { type: 'video/webm' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'sdf-light-illusion.webm';
    document.body.appendChild(a); a.click(); a.remove();
    status.textContent = `Done — sdf-light-illusion.webm (${(blob.size/1024/1024).toFixed(1)} MB)`;
    bar.style.width = '100%';
  };

  recorder.start();
  const t0 = performance.now();
  function tick() {
    const elapsed = (performance.now() - t0) / 1000;
    if (elapsed >= TOTAL) {
      applyState(TOTAL);
      renderer.render(scene, camera);
      recorder.stop();
      return;
    }
    applyState(elapsed);
    renderer.render(scene, camera);
    status.textContent = `Recording … ${elapsed.toFixed(1)} / ${TOTAL}s`;
    bar.style.width = `${(elapsed / TOTAL * 100).toFixed(1)}%`;
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}
</script>
</body>
</html>
